<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195">
<defs>
  <style>
  .mono { font-family: 'Fira Code','Consolas','SFMono-Regular',monospace; }
  .sans { font-family: 'Segoe UI', system-ui, sans-serif; }

  @keyframes cardFade {
    0% { opacity: 0; }
    100% { opacity: 1; }
  }
  #cardBg { animation: cardFade .6s ease-out both; }

  @keyframes titleSlide {
    0% { opacity: 0; transform: translateY(-8px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  #title { animation: titleSlide .6s ease-out .1s both; }

  @keyframes ringDraw {
    0% { stroke-dashoffset: 326.73; }
    100% { stroke-dashoffset: 22.87; }
  }
  #ringProgress {
    stroke-dasharray: 326.73;
    stroke-dashoffset: 326.73;
    animation: ringDraw 1.6s cubic-bezier(.25,.9,.3,1) .3s forwards;
  }

  @keyframes gradePop {
    0% { opacity: 0; transform: scale(.6); }
    100% { opacity: 1; transform: scale(1); }
  }
  #gradeText { animation: gradePop .5s cubic-bezier(.34,1.56,.64,1) 1.5s both; transform-box: fill-box; transform-origin: center; }

  @keyframes ringGlowPulse {
    0%,100% { opacity: .55; }
    50% { opacity: 1; }
  }
  #ringGlowLayer { animation: ringGlowPulse 3s ease-in-out 1.9s infinite; }

  @keyframes rowSlide {
    0% { opacity: 0; transform: translateX(28px); }
    100% { opacity: 1; transform: translateX(0); }
  }
  .row { animation: rowSlide .55s cubic-bezier(.22,.9,.3,1) both; }

  @keyframes numCount {
    0% { opacity: 0; }
    60% { opacity: 0; }
    100% { opacity: 1; }
  }
  .numVal { animation: numCount .4s ease-out both; }

  @keyframes borderGlow {
    0%,100% { stroke-opacity: .65; }
    50% { stroke-opacity: 1; }
  }
  #cardBorder { animation: borderGlow 3.2s ease-in-out infinite; }
</style>

  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#161b22"/>
    <stop offset="100%" stop-color="#0d1117"/>
  </linearGradient>

  <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#00f0ff"/>
    <stop offset="100%" stop-color="#a855f7"/>
  </linearGradient>

  <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#a855f7"/>
    <stop offset="100%" stop-color="#00f0ff"/>
  </linearGradient>

  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="4.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowStrong" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <clipPath id="cardClip"><rect x="0" y="0" width="495" height="195" rx="16"/></clipPath>
</defs>

<g clip-path="url(#cardClip)">
  <rect id="cardBg" x="0" y="0" width="495" height="195" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="495" height="195" fill="#00f0ff" opacity="0.02"/>

  <g opacity="0.05" stroke="#00f0ff" stroke-width="0.6">
    <path d="M0,50 H495 M0,100 H495 M0,150 H495 M60,0 V195 M180,0 V195 M320,0 V195 M440,0 V195"/>
  </g>

  <text id="title" x="247.5" y="26" text-anchor="middle" class="sans" font-size="15" font-weight="700"
    letter-spacing="0.5" fill="url(#titleGrad)">GitHub Overview &amp; Performance</text>
  <line x1="24" y1="36" x2="471" y2="36" stroke="#00f0ff" stroke-opacity="0.18" stroke-width="1"/>

  <!-- rank ring -->
  <g id="ringGlowLayer">
    <circle cx="92" cy="118" r="58" fill="none" stroke="#00f0ff" stroke-width="1" opacity="0.35" filter="url(#glow)"/>
  </g>
  <circle cx="92" cy="118" r="52" fill="none" stroke="#2a3138" stroke-width="9"/>
  <circle id="ringProgress" cx="92" cy="118" r="52" fill="none" stroke="url(#ringGrad)" stroke-width="9"
    stroke-linecap="round" transform="rotate(-90 92 118)" filter="url(#glowStrong)"/>
  <text id="gradeText" x="92" y="127" text-anchor="middle" class="sans" font-size="30" font-weight="800" fill="#ffb703">A+</text>
  <text x="92" y="152" text-anchor="middle" class="mono" font-size="9.5" letter-spacing="2" fill="#9aa4b2">RANK</text>
  <text x="92" y="54" text-anchor="middle" class="mono" font-size="9.5" letter-spacing="1.5" fill="#a855f7">OVERALL GRADE</text>

  <!-- stat rows -->
  
    <g class="row" style="animation-delay:0.15s">
      <rect x="188" y="55" width="288" height="42" rx="10" fill="#1c232c" stroke="#00f0ff" stroke-opacity="0.28" stroke-width="1"/>
      <g transform="translate(200,66)" stroke="#00f0ff" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="10" y1="0" x2="10" y2="6.5"/><circle cx="10" cy="10" r="3.6"/><line x1="10" y1="13.6" x2="10" y2="20"/></g>
      <text x="230" y="72" class="sans" font-size="10.5" fill="#9aa4b2">Total Commits</text>
      <text x="230" y="87" class="mono numVal" style="animation-delay:0.5s" font-size="15" font-weight="700" fill="#ffb703">1,482</text>
    </g>
    <g class="row" style="animation-delay:0.35s">
      <rect x="188" y="100" width="288" height="42" rx="10" fill="#1c232c" stroke="#a855f7" stroke-opacity="0.28" stroke-width="1"/>
      <g transform="translate(200,111)" stroke="#a855f7" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="4" r="2.6" fill="none"/><circle cx="5" cy="16" r="2.6" fill="none"/><circle cx="15" cy="10" r="2.6" fill="none"/><path d="M5,6.6 L5,13.4"/><path d="M7.2,4.6 C11,4.6 12.6,6 13.4,7.8"/></g>
      <text x="230" y="117" class="sans" font-size="10.5" fill="#9aa4b2">Total PRs &amp; Issues</text>
      <text x="230" y="132" class="mono numVal" style="animation-delay:0.7s" font-size="15" font-weight="700" fill="#ffb703">96</text>
    </g>
    <g class="row" style="animation-delay:0.55s">
      <rect x="188.0" y="145" width="139.0" height="42" rx="10" fill="#1c232c" stroke="#ffb703" stroke-opacity="0.28" stroke-width="1"/>
      <g transform="translate(198.0,156)" stroke="#ffb703" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M10,1 C6,6 4,9 4,12.5 C4,16.6 7,19.5 10,19.5 C13,19.5 16,16.6 16,12.5 C16,10.2 14.6,8.6 13.4,7.4 C13.6,9.4 12.4,10.5 11.5,10.2 C12.2,7.6 10.8,4.2 10,1 Z" fill="#ffb703" fill-opacity="0.22" stroke-width="1.4"/></g>
      <text x="226.0" y="162" class="sans" font-size="9.5" fill="#9aa4b2">Current Streak</text>
      <text x="226.0" y="177" class="mono numVal" style="animation-delay:0.9s" font-size="14" font-weight="700" fill="#ffb703">21 days</text>
    </g>

    <g class="row" style="animation-delay:0.65s">
      <rect x="337.0" y="145" width="139.0" height="42" rx="10" fill="#1c232c" stroke="#00f0ff" stroke-opacity="0.28" stroke-width="1"/>
      <g transform="translate(347.0,156)" stroke="#00f0ff" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3,2.5 h9 a2,2 0 0 1 2,2 v13 h-11 a2,2 0 0 1 -2,-2 v-11 a2,2 0 0 1 2,-2 Z" fill="none"/><line x1="3" y1="15" x2="14" y2="15"/></g>
      <text x="375.0" y="162" class="sans" font-size="9.5" fill="#9aa4b2">Contributed Repos</text>
      <text x="375.0" y="177" class="mono numVal" style="animation-delay:1.0s" font-size="14" font-weight="700" fill="#ffb703">34</text>
    </g>

  <rect id="cardBorder" x="2" y="2" width="491" height="191" rx="14" fill="none" stroke="#00f0ff" stroke-width="2" filter="url(#glow)"/>
  <rect x="2" y="2" width="491" height="191" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
</g>
</svg>