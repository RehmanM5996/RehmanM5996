<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195">
<defs>
  <style>
  .sans { font-family: 'Segoe UI', system-ui, sans-serif; }
  .mono { font-family: 'Fira Code','Consolas','SFMono-Regular',monospace; }

  @keyframes cardFade { 0% { opacity:0; } 100% { opacity:1; } }
  #cardBg { animation: cardFade .6s ease-out both; }

  @keyframes titleSlide {
    0% { opacity:0; transform: translateY(-8px); }
    100% { opacity:1; transform: translateY(0); }
  }
  #title { animation: titleSlide .6s ease-out .1s both; }

  @keyframes labelFade {
    0% { opacity:0; transform: translateX(-10px); }
    100% { opacity:1; transform: translateX(0); }
  }
  .rowLabel { animation: labelFade .5s ease-out both; }

  @keyframes pctFade {
    0% { opacity:0; }
    100% { opacity:1; }
  }
  .pctText { animation: pctFade .4s ease-out both; }

  @keyframes borderGlow {
    0%,100% { stroke-opacity:.6; }
    50% { stroke-opacity:1; }
  }
  #cardBorder { animation: borderGlow 3.4s ease-in-out infinite; }

  @keyframes trackFade {
    0% { opacity:0; }
    100% { opacity:1; }
  }
  .track { animation: trackFade .4s ease-out both; }
</style>

  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#161b22" stop-opacity="0.92"/>
    <stop offset="100%" stop-color="#0d1117" stop-opacity="0.96"/>
  </linearGradient>

  <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#a855f7"/>
    <stop offset="100%" stop-color="#00f0ff"/>
  </linearGradient>

  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="barGlow" x="-20%" y="-150%" width="140%" height="400%">
    <feGaussianBlur stdDeviation="2.2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <clipPath id="cardClip"><rect x="0" y="0" width="495" height="195" rx="16"/></clipPath>
</defs>

<g clip-path="url(#cardClip)">
  <rect id="cardBg" x="0" y="0" width="495" height="195" fill="url(#bgGrad)"/>

  <g opacity="0.05" stroke="#a855f7" stroke-width="0.6">
    <path d="M0,50 H495 M0,100 H495 M0,150 H495 M120,0 V195 M250,0 V195 M380,0 V195"/>
  </g>

  <text id="title" x="247.5" y="28" text-anchor="middle" class="sans" font-size="16" font-weight="700"
    letter-spacing="0.5" fill="url(#titleGrad)">Most Used Languages</text>
  <line x1="24" y1="38" x2="471" y2="38" stroke="#a855f7" stroke-opacity="0.22" stroke-width="1"/>

  
  <text class="sans rowLabel" style="animation-delay:0.15s" x="24" y="56" font-size="12.5" font-weight="600" fill="#e6edf3">JavaScript</text>
  <text class="mono pctText" style="animation-delay:1.3000000000000003s" x="471" y="56" text-anchor="end" font-size="12.5" font-weight="700" fill="#ffb703">38%</text>
  <rect class="track" style="animation-delay:0.15s" x="24" y="62" width="447" height="12" rx="6" fill="#232b36"/>
  <rect x="24" y="62" width="0" height="12" rx="6" fill="#ffb703" filter="url(#barGlow)">
    <animate attributeName="width" from="0" to="169.9" begin="0.35s" dur="1.1s" fill="freeze" calcMode="spline" keySplines="0.22 0.9 0.3 1"/>
  </rect>
  <rect x="24" y="62" width="447" height="12" rx="6" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>

  <text class="sans rowLabel" style="animation-delay:0.27s" x="24" y="92" font-size="12.5" font-weight="600" fill="#e6edf3">PHP</text>
  <text class="mono pctText" style="animation-delay:1.57s" x="471" y="92" text-anchor="end" font-size="12.5" font-weight="700" fill="#8892bf">27%</text>
  <rect class="track" style="animation-delay:0.27s" x="24" y="98" width="447" height="12" rx="6" fill="#232b36"/>
  <rect x="24" y="98" width="0" height="12" rx="6" fill="#8892bf" filter="url(#barGlow)">
    <animate attributeName="width" from="0" to="120.7" begin="0.47s" dur="1.25s" fill="freeze" calcMode="spline" keySplines="0.22 0.9 0.3 1"/>
  </rect>
  <rect x="24" y="98" width="447" height="12" rx="6" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>

  <text class="sans rowLabel" style="animation-delay:0.39s" x="24" y="128" font-size="12.5" font-weight="600" fill="#e6edf3">HTML/CSS</text>
  <text class="mono pctText" style="animation-delay:1.8400000000000003s" x="471" y="128" text-anchor="end" font-size="12.5" font-weight="700" fill="#00f0ff">22%</text>
  <rect class="track" style="animation-delay:0.39s" x="24" y="134" width="447" height="12" rx="6" fill="#232b36"/>
  <rect x="24" y="134" width="0" height="12" rx="6" fill="#00f0ff" filter="url(#barGlow)">
    <animate attributeName="width" from="0" to="98.3" begin="0.59s" dur="1.4000000000000001s" fill="freeze" calcMode="spline" keySplines="0.22 0.9 0.3 1"/>
  </rect>
  <rect x="24" y="134" width="447" height="12" rx="6" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>

  <text class="sans rowLabel" style="animation-delay:0.51s" x="24" y="164" font-size="12.5" font-weight="600" fill="#e6edf3">MySQL</text>
  <text class="mono pctText" style="animation-delay:2.11s" x="471" y="164" text-anchor="end" font-size="12.5" font-weight="700" fill="#00758f">13%</text>
  <rect class="track" style="animation-delay:0.51s" x="24" y="170" width="447" height="12" rx="6" fill="#232b36"/>
  <rect x="24" y="170" width="0" height="12" rx="6" fill="#00758f" filter="url(#barGlow)">
    <animate attributeName="width" from="0" to="58.1" begin="0.71s" dur="1.55s" fill="freeze" calcMode="spline" keySplines="0.22 0.9 0.3 1"/>
  </rect>
  <rect x="24" y="170" width="447" height="12" rx="6" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>

  <rect id="cardBorder" x="2" y="2" width="491" height="191" rx="14" fill="none" stroke="#a855f7" stroke-width="2" filter="url(#glow)"/>
  <rect x="2" y="2" width="491" height="191" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
</g>
</svg>